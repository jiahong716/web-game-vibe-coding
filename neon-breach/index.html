<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <title>NEON BREACH — FPS Prototype</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <main id="game">
      <div id="hud" aria-live="polite">
        <div class="hud-block">
          <span class="label">VITALS</span>
          <div class="health-track"><div id="health-fill"></div></div>
          <strong id="health-value">100</strong>
        </div>
        <div class="hud-center">
          <span class="label">BREACHES</span>
          <strong id="score">00</strong>
        </div>
        <div class="hud-block hud-right">
          <span class="label">TIME LEFT</span>
          <strong id="timer">60</strong>
          <span class="sub-label">SECONDS</span>
        </div>
      </div>

      <div id="crosshair" aria-hidden="true"><i></i><b></b></div>
      <div id="hit-marker" aria-hidden="true">+</div>
      <div id="damage-flash" aria-hidden="true"></div>
      <div id="message" aria-live="assertive"></div>

      <section id="overlay" class="overlay">
        <div class="panel">
          <p class="eyebrow">SIMULATION 07 / TRAINING ARENA</p>
          <h1>NEON<br><span>BREACH</span></h1>
          <p id="intro-copy" class="intro">清除訓練場內的失控守衛，或撐過 60 秒。守衛接近時會造成傷害。</p>
          <div class="controls">
            <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動</span>
            <span><kbd>MOUSE</kbd> 轉動視角</span>
            <span><kbd>右鍵</kbd> 按住瞄準</span>
            <span><kbd>左鍵</kbd> 射擊</span>
            <span><kbd>ESC</kbd> 暫停</span>
          </div>
          <button id="start-button" type="button">進入模擬 <span>↗</span></button>
          <p class="footnote">建議使用桌上型電腦與滑鼠</p>
        </div>
      </section>
    </main>
  </body>
</html>
